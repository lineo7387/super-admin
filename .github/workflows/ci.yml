name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-contract:
    name: Node ${{ matrix.node-version }} CLI and starter contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 22.13.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter create-super-admin build

      - name: Test CLI
        run: pnpm --filter create-super-admin test

      - name: Generate standard starter
        run: node packages/cli/dist/cli.js "${{ runner.temp }}/super-admin-runtime-starter" --theme base --pm pnpm

      - name: Install starter dependencies with strict engines
        run: pnpm --dir "${{ runner.temp }}/super-admin-runtime-starter" install --engine-strict

      - name: Build generated starter
        run: pnpm --dir "${{ runner.temp }}/super-admin-runtime-starter" build

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release impact
        if: github.event_name == 'pull_request'
        run: pnpm release:impact --base "${{ github.event.pull_request.base.sha }}"

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate packed starters
        run: pnpm validate:starter

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate mock-backed browser flow
        run: pnpm test:browser
        timeout-minutes: 5

      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-browser-smoke
          path: output/playwright/admin-smoke
          if-no-files-found: ignore

      - name: Build docs
        run: pnpm docs:build
